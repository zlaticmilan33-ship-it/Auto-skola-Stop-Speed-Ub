    // asking the direct parent over the relay protocol above. An

">O školi<\u002Fa>\n        <a href=\"#cenovnik\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0; border-bottom: 1px solid #ece3d5\">Cenovnik<\u002Fa>\n        <a href=\"#upis\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0; border-bottom: 1px solid #ece3d5\">Upis<\u002Fa>\n        <a href=\"#instruktori\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0; border-bottom: 1px solid #ece3d5\">Instruktori<\u002Fa>\n        <a href=\"#vozila\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0; border-bottom: 1px solid #ece3d5\">Vozni park<\u002Fa>\n        <a href=\"#savet\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0; border-bottom: 1px solid #ece3d5\">Instruktor savetuje<\u002Fa>\n        <a href=\"#propisi\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0; border-bottom: 1px solid #ece3d5\">Saobraćajni propisi<\u002Fa>\n        <a href=\"#kontakt\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"color: #3a332c; padding: 12px 0\">Kontakt<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"cenovnik\" style=\"padding: 8px var(--pad) 56px\">\n    <div class=\"cols\" style=\"display: grid; grid-template-columns: 0.4fr 0.6fr; gap: 40px\">\n      <div>\n        <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Cenovnik<\u002Fp>\n        <h1 style=\"margin: 0 0 16px; font-family: Poppins, sans-serif; font-size: 30px; font-weight: 700; color: #3a332c\">Cena na jednake mesečne rate<\u002Fh1>\n        <p style=\"margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #5c5348\">Učenicima naše škole omogućeno je plaćanje na jednake mesečne rate, bez kamate. Za tačan iznos po kategoriji pozovi ili pošalji prijavu. Cena zavisi od kategorije i broja časova.<\u002Fp>\n        <a href=\"tel:+381642162202\" style=\"border: 2px solid #e3d9c9; border-radius: 999px; color: #3a332c; padding: 12px 20px; font-weight: 600; font-size: 14px; display: inline-block\">Pitaj cenu: 064 2162202<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background: #fff; border: 1px solid #ece3d5; border-radius: 20px; padding: 28px; margin-top: -4px\">\n        <sc-raw-table style=\"width: 100%; border-collapse: collapse; font-size: 15px\">\n          <sc-raw-thead>\n            <sc-raw-tr><sc-raw-th style=\"text-align: left; padding: 0 0 12px; font-family: Poppins, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7d6f\">Usluga<\u002Fsc-raw-th><sc-raw-th style=\"text-align: left; padding: 0 0 12px; font-family: Poppins, sans-serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a7d6f; width: 34%\">Cena<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ cenovnik }}\" as=\"c\" hint-placeholder-count=\"7\">\n              <sc-raw-tr><sc-raw-td style=\"padding: 12px 0; font-weight: 600\">{{ c.usluga }}<\u002Fsc-raw-td><sc-raw-td style=\"padding: 12px 0; color: #8a7d6f; font-family: ui-monospace, monospace\">{{ c.cena }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <p style=\"margin: 16px 0 0; font-size: 12px; color: #a89c8b\">Upiši ovde svoje cene kada budeš spreman. Mesta u tabeli su pripremljena.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"upis\" style=\"padding: 40px var(--pad) 56px; background: #f4ede2\">\n    <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Kako se upisati<\u002Fp>\n    <h2 style=\"margin: 0 0 32px; font-family: Poppins, sans-serif; font-size: 30px; font-weight: 700; color: #3a332c\">Četiri koraka do vozačke<\u002Fh2>\n    <div class=\"cols3\" style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px\">\n      <sc-for list=\"{{ koraci }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background: #fff; border-radius: 20px; padding: 24px\">\n          <p style=\"margin: 0 0 12px; font-family: ui-monospace, monospace; font-size: 14px; color: var(--accent)\">{{ s.broj }}<\u002Fp>\n          <h3 style=\"margin: 0 0 8px; font-family: Poppins, sans-serif; font-size: 17px; font-weight: 700; color: #3a332c\">{{ s.naslov }}<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #8a7d6f\">{{ s.opis }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"instruktori\" style=\"padding: 56px var(--pad)\">\n    <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Instruktori<\u002Fp>\n    <h2 style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 30px; font-weight: 700; color: #3a332c\">Ljudi sa kojima izlaziš na put<\u002Fh2>\n    <p style=\"margin: 0 0 28px; font-size: 14px; color: #a89c8b; font-family: ui-monospace, monospace\">pošalji imena, kategorije i fotografije instruktora i ubaciću ih ovde<\u002Fp>\n    <div class=\"cols3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px\">\n      <sc-for list=\"{{ instruktori }}\" as=\"i\" hint-placeholder-count=\"3\">\n        <div style=\"background: #fff; border-radius: 20px; overflow: hidden\">\n          <div style=\"aspect-ratio: 4/5; background: #ece3d5\"><\u002Fdiv>\n          <div style=\"padding: 18px\">\n            <h3 style=\"margin: 0 0 4px; font-family: Poppins, sans-serif; font-size: 17px; font-weight: 700; color: #3a332c\">{{ i.ime }}<\u002Fh3>\n            <p style=\"margin: 0; font-size: 14px; color: #8a7d6f\">{{ i.uloga }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"savet\" style=\"padding: 40px var(--pad) 56px; background: #f4ede2\">\n    <div class=\"cols\" style=\"display: grid; grid-template-columns: 0.45fr 0.55fr; gap: 40px; align-items: start\">\n      <div>\n        <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600\">Rubrika<\u002Fp>\n        <h2 style=\"margin: 0 0 16px; font-family: Poppins, sans-serif; font-size: 28px; font-weight: 700; color: #3a332c\">Instruktor savetuje<\u002Fh2>\n        <p style=\"margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #5c5348; max-width: 40ch\">Kratki saveti iz vozila. Ono što najčešće ponavljamo kandidatima na časovima.<\u002Fp>\n        <div style=\"display: grid; gap: 12px\">\n          <div>\n            <div class=\"photo-real\" style=\"aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; background: #ece3d5\"><\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 13px; color: #8a7d6f\">Grupna fotografija instruktora sa vozilima<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div class=\"photo-real\" style=\"aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; background: #ece3d5\"><\u002Fdiv>\n            <p style=\"margin: 8px 0 0; font-size: 13px; color: #8a7d6f\">Poligon za obuku vozača<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border-radius: 16px; padding: 20px; margin-top: 4px\">\n            <h3 style=\"margin: 0 0 10px; font-family: Poppins, sans-serif; font-size: 16px; font-weight: 700; color: #3a332c\">Polaganje testova za vožnju<\u002Fh3>\n            <p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Koliko traje priprema.<\u002Fstrong> Zavisi od kategorije i tvog tempa, obično nekoliko nedelja teorijske nastave uz časove vožnje po dogovoru.<\u002Fp>\n            <p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Kako se ispravno uči.<\u002Fstrong> Redovno pratiš teorijsku nastavu, ponavljaš propise i vežbaš vožnju u kontinuitetu, bez velikih pauza između časova.<\u002Fp>\n            <p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Šta se polaže.<\u002Fstrong> Teorijski ispit (propisi i prva pomoć) i praktični ispit vožnje.<\u002Fp>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Saveti za dan ispita.<\u002Fstrong> Naspavaj se, dođi ranije i vozi kao na času, mirno i po pravilima koja si uvežbao.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #fff; border-radius: 16px; padding: 20px; margin-top: 12px\">\n            <h3 style=\"margin: 0 0 10px; font-family: Poppins, sans-serif; font-size: 16px; font-weight: 700; color: #3a332c\">Prva pomoć: šta uraditi prvo<\u002Fh3>\n            <p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Osiguraj mesto nezgode.<\u002Fstrong> Postavi trougao, uključi četvorke i, ako je bezbedno, iskopčaj kontakt vozila.<\u002Fp>\n            <p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Pozovi pomoć.<\u002Fstrong> Hitna pomoć 194, policija 192. Reci lokaciju, broj povređenih i da li su pri svesti.<\u002Fp>\n            <p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Ne pomeraj povređenog<\u002Fstrong> osim ako mu preti dalja opasnost (požar, saobraćaj). Nepotrebno pomeranje može pogoršati povredu.<\u002Fp>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #5c5348\"><strong>Ostani prisutan<\u002Fstrong> i prati stanje povređenog do dolaska hitne pomoći.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 12px\">\n        <sc-for list=\"{{ saveti }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div class=\"savet-row\" style=\"background: #fff; border-radius: 18px; padding: 22px; display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: start\">\n            <div>\n              <div class=\"photo-real\" style=\"aspect-ratio: 4/5; border-radius: 14px; overflow: hidden; background: #ece3d5\"><\u002Fdiv>\n              <p style=\"margin: 8px 0 0; font-size: 12px; font-weight: 600; color: #3a332c; line-height: 1.3\">{{ s.ime }}<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <p style=\"margin: 0 0 6px; font-family: Poppins, sans-serif; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent)\">{{ s.tema }}<\u002Fp>\n              <h3 style=\"margin: 0 0 6px; font-family: Poppins, sans-serif; font-size: 17px; font-weight: 700; color: #3a332c\">{{ s.naslov }}<\u002Fh3>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #5c5348\">{{ s.tekst }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"propisi\" style=\"padding: 56px var(--pad)\">\n    <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Saobraćajni propisi<\u002Fp>\n    <h2 style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 30px; font-weight: 700; color: #3a332c\">Pravila koja se najčešće mešaju<\u002Fh2>\n    <p style=\"margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #5c5348; max-width: 60ch\">Kratak pregled propisa o kojima kandidati najviše pitaju. Detaljno ih obrađujemo na teorijskoj nastavi.<\u002Fp>\n    <p style=\"margin: 0 0 28px; font-size: 14px\"><a href=\"{{ linkZakon }}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight: 600\">Zakon o bezbednosti saobraćaja na putevima. Pun tekst (paragraf.rs) →<\u002Fa><\u002Fp>\n    <div class=\"cols3\" style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px\">\n      <sc-for list=\"{{ propisi }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <div style=\"background: #fff; border: 1px solid #ece3d5; border-radius: 20px; padding: 24px\">\n          <p style=\"margin: 0 0 10px; font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent)\">{{ p.oznaka }}<\u002Fp>\n          <h3 style=\"margin: 0 0 8px; font-family: Poppins, sans-serif; font-size: 17px; font-weight: 700; color: #3a332c\">{{ p.naslov }}<\u002Fh3>\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.55; color: #8a7d6f\">{{ p.tekst }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"background: #f4ede2; border-radius: 20px; padding: 28px\">\n      <p style=\"margin: 0 0 14px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Važni pravilnici<\u002Fp>\n      <ol style=\"margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15px; line-height: 1.5; color: #3a332c; max-width: 66ch\">\n        <li>Pravilnik o teorijskoj i praktičnoj obuci kandidata za vozače;<\u002Fli>\n        <li>Pravilnik o uslovima koje mora da ispunjava privredno društvo odnosno ogranak privrednog društva ili srednja stručna škola koji vrše osposobljavanje kandidata za vozače;<\u002Fli>\n        <li>Pravilnik o organizovanju, sprovođenju i načinu polaganja vozačkog ispita;<\u002Fli>\n        <li>Pravilnik o vozačkim dozvolama;<\u002Fli>\n        <li>Pravilnik o sadržaju, načinu vođenja i rokovima čuvanja evidencija iz oblasti osposobljavanja kandidata za vozače;<\u002Fli>\n      <\u002Fol>\n      <p style=\"margin: 16px 0 0; font-size: 14px; line-height: 1.6; color: #5c5348; max-width: 66ch\">Važeći tekstovi propisa dostupni su na sajtu Ministarstva unutrašnjih poslova i Pravno-informacionom sistemu Republike Srbije.<\u002Fp>\n      <p style=\"margin: 14px 0 0; font-size: 15px; font-weight: 600; line-height: 1.55; color: #3a332c; max-width: 66ch\">Lekarsko uverenje i položena prva pomoć su uslov za izdavanje vozačke dozvole.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"vozila\" style=\"padding: 40px var(--pad) 56px; background: #f4ede2\">\n    <div class=\"cols\" style=\"display: grid; grid-template-columns: 0.4fr 0.6fr; gap: 40px\">\n      <div>\n        <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Vozni park<\u002Fp>\n        <h2 style=\"margin: 0 0 16px; font-family: Poppins, sans-serif; font-size: 28px; font-weight: 700; color: #3a332c\">Uredno održavana, čista i tehnički ispravna<\u002Fh2>\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #5c5348\">Vozila za svaku kategoriju servisiramo redovno, a pre svakog časa su spremna i uredna. Pošalji fotografije svog voznog parka i postaviću ih u ovu galeriju.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cols2\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px\">\n        <sc-for list=\"{{ vozila }}\" as=\"v\" hint-placeholder-count=\"4\">\n          <div style=\"aspect-ratio: 3/2; border-radius: 16px; background: #ece3d5\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"pitanja\" style=\"padding: 56px var(--pad)\">\n    <div class=\"cols\" style=\"display: grid; grid-template-columns: 0.4fr 0.6fr; gap: 40px; align-items: start\">\n      <div style=\"position: sticky; top: 100px\">\n        <p style=\"margin: 0 0 12px; font-family: Poppins, sans-serif; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #8a7d6f; font-weight: 600\">Česta pitanja<\u002Fp>\n        <h2 style=\"m icmilan33@gmail.com<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { poslato: false, menuOpen: false };\n\n  renderVals() {\n    return {\n      linkZakon: this.props.linkZakon ?? \"https://www.paragraf.rs/propisi/zakon_o_bezbednosti_saobracaja_na_putevima.html\",\n      menuStyle: { display: this.state.menuOpen ? \"block\" : \"none\" },\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      poslato: this.state.poslato,\n      nijePoslato: !this.state.poslato,\n      posalji: (e) => { e.preventDefault(); this.setState({ poslato: true }); },\n      cenovnik: [\n        { usluga: \"B kategorija (automobil)\", cena: \"na upit\" },\n        { usluga: \"A kategorija (motocikl)\", cena: \"na upit\" },\n        { usluga: \"C kategorija (kamion)\", cena: \"na upit\" },\n        { usluga: \"D kategorija (autobus)\", cena: \"na upit\" },\n        { usluga: \"E (prikolica)\", cena: \"na upit\" },\n        { usluga: \"Dodatni čas vožnje\", cena: \"na upit\" },\n        { usluga: \"Prva pomoć\", cena: \"na upit\" }\n      ],\n      koraci: [\n        { broj: \"01\", naslov: \"Prijava\", opis: \"Popuni online prijavu ili nas pozovi na 064 2162202.\" },\n        { broj: \"02\", naslov: \"Upis u kancelariji\", opis: \"Doneseš dokumentaciju, dogovaramo rate i početak nastave.\" },\n        { broj: \"03\", naslov: \"Teorija i vožnja\", opis: \"Teorijska nastava, pa časovi vožnje po tvom raspoloživom terminu.\" },\n        { broj: \"04\", naslov: \"Ispit\", opis: \"Izlazak na teorijski i praktični ispit kada instruktor kaže da si spreman.\" }\n      ],\n      instruktori: [\n        { ime: \"Ime instruktora\", uloga: \"B kategorija\" },\n        { ime: \"Ime instruktora\", uloga: \"C i E kategorija\" },\n        { ime: \"Ime instruktora\", uloga: \"A i D kategorija\" }\n      ],\n      propisi: [\n        { oznaka: \"01\", naslov: \"Ograničenja brzine\", tekst: \"U naselju 50 km/h, van naselja 80, na brzoj saobraćajnici 100 i na autoputu 130 km/h, ako znakom nije određeno drugačije.\" },\n        { oznaka: \"02\", naslov: \"Prvenstvo prolaza\", tekst: \"Prvo znak i svetlosni signal, pa oznake na kolovozu, i na kraju pravilo desne strane. Vozila na kružnom toku imaju prvenstvo nad onima koji ulaze.\" },\n        { oznaka: \"03\", naslov: \"Alkohol u krvi\", tekst: \"Za vozače sa probnom vozačkom dozvolom i za kandidate na obuci granica je 0,00 ‰. Vožnja pod dejstvom alkohola nije dozvoljena.\" },\n        { oznaka: \"04\", naslov: \"Probna vozačka dozvola\", tekst: \"Nosi ograničenja: bez vožnje noću u određenom periodu, bez upotrebe telefona i uz oznaku „P“ na vozilu.\" },\n        { oznaka: \"05\", naslov: \"Sigurnosni pojas i deca\", tekst: \"Pojas je obavezan za sve u vozilu. Deca se prevoze u sedištu koje odgovara njihovoj visini i masi.\" },\n        { oznaka: \"06\", naslov: \"Svetla i oprema\", tekst: \"Dnevna svetla su obavezna tokom cele godine. U vozilu se nose rezervni set sijalica, sigurnosni trougao, aparat za gašenje požara i prva pomoć.\" }\n      ],\n      saveti: [\n        { tema: \"Prvi čas\", naslov: \"Prvi čas nije vožnja, nego navikavanje\", tekst: \"Pre pokretanja podesi sedište, naslon za glavu i retrovizore, pa pronađi papučice bez gledanja. Prvi čas radimo na mirnom terenu. Bitno je da ti vozilo postane poznato, ne da pređeš kilometre.\", ime: \"ime i prezime instruktora\" },\n        { tema: \"Gašenje motora\", naslov: \"Zašto se motor gasi i kako to prestaje\", tekst: \"Motor se gasi kada spojnica ide gore brže nego što gas ide dole. Kvačilo puštaj do tačke spajanja, zadrži nogu i tek onda dodaj gas. Ako se ugasi, staviš u prazan hod, ručna, pa ponovo, bez nervoze.\", ime: \"ime i prezime instruktora\" },\n        { tema: \"Parkiranje\", naslov: \"Parkiranje se radi polako i sa referencama\", tekst: \"Uzduž ili poprečno, princip je isti: mala brzina, mnogo volana i fiksne referentne tačke na vozilu. Bolje dva puta ispraviti nego jednom pogoditi slučajno.\", ime: \"ime i prezime instruktora\" },\n        { tema: \"Kružni tok\", naslov: \"U kružnom toku odlučuješ pre ulaza\", tekst: \"Traku i pokazivač smera biraš pre ulaska, prema izlazu koji ti treba. U toku imaju prvenstvo vozila koja su već unutra, a desni pokazivač uključuješ pri izlasku.\", ime: \"ime i prezime instruktora\" },\n        { tema: \"Priprema za ispit\", naslov: \"Na ispitu voziš kao na času\", tekst: \"Ispitivač ne traži savršenstvo, nego bezbednu i predvidivu vožnju: pogled u retrovizore, jasni pokazivači, prilagođena brzina. Naspavaj se i dođi ranije, smiren kandidat vozi bolje.\", ime: \"ime i prezime instruktora\" },\n        { tema: \"Vožnja po kiši i noću\", naslov: \"Po mokrom putu sve traje duže\", tekst: \"Na mokrom kolovozu put kočenja se udvostručuje, pa rastojanje do vozila ispred povećaj i brzinu smanji ispod ograničenja. Noću vozi tako da uvek možeš da se zaustaviš unutar osvetljenog dela puta.\", ime: \"ime i prezime instruktora\" },\n        { tema: \"Raskrsnica i prvenstvo\", naslov: \"Prvenstvo se rešava pre nego što uđeš\", tekst: \"Znak, oznake na kolovozu, pa pravilo desne strane, u tom redu. Ako nisi siguran, smanji brzinu i uspostavi kontakt pogledom sa drugim vozačem; nesigurna vožnja kroz raskrsnicu je opasnija od zaustavljanja.\", ime: \"ime i prezime instruktora\" }\n      ],\n      vozila: [\"vozilo B kategorije\", \"vozilo C kategorije\", \"motocikl\", \"autobus / poligon\"],\n      pitanja: [\n        { q: \"Koliko traje obuka?\", a: \"Zavisi od kategorije i tvog tempa. Teorijska nastava ide po grupama, a časove vožnje zakazuješ prema svom raspoloživom vremenu. Javi se i dogovorićemo realan raspored.\" },\n        { q: \"Mogu li da plaćam na rate?\", a: \"Da. Učenicima naše škole omogućeno je plaćanje na jednake mesečne rate.\" },\n        { q: \"Sa koliko godina mogu da počnem?\", a: \"Obuka za B kategoriju može da počne i pre 18. godine. Pozovi nas za tačne uslove za kategoriju koja te zanima.\" },\n        { q: \"Šta mi treba za upis?\", a: \"Lični dokument i lekarsko uverenje za odgovarajuću kategoriju. Sve ostalo objašnjavamo prilikom upisa u kancelariji.\" },\n        { q: \"Imate li obnovu znanja?\", a: \"Imamo. Ako imaš vozačku ali dugo nisi vozio, radimo dodatne časove vožnje po dogovoru.\" },\n        { q: \"Koliko časova vožnje je obavezno?\", a: \"Broj časova propisan je zakonom i zavisi od kategorije. Ako ti pred ispit treba još sigurnosti, dodatne časove zakazuješ po želji i plaćaš pojedinačno.\" },\n        { q: \"Šta ako ne položim iz prvog puta?\", a: \"Ponovni izlazak na ispit je moguć posle propisanog roka. Pre toga sa instruktorom prođemo ono što je bilo problem, da na sledeći ispit izađeš spremniji.\" }\n      ]\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
